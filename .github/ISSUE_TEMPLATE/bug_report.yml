name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please do not include screenshots that show private information. For a security problem, use the Security tab instead."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open https://example.com\n2. Start a guide\n3. ..."
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Extension version (chrome://extensions) and Chrome version (chrome://version).
      placeholder: "Extension 0.1.0, Chrome 131"
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Errors
      description: Anything under Errors on the extension's card in chrome://extensions, or in the page console.
