<!doctype html><html><head><meta charset="utf-8"><title>Demo shop: billing</title>
<style>body{font:16px system-ui;margin:40px}button{font:inherit;padding:8px 12px}
#menu{overflow:hidden;height:0;width:520px;background:#1e293b;color:#fff;border-radius:12px;transition:height 1.2s ease}
#menu.open{height:320px}#menu p{margin:16px}
.track{position:relative;width:900px;height:150px;background:#e2e8f0;border-radius:16px;margin:24px 0}
#knob{position:absolute;left:0;top:0;width:220px;height:150px;border-radius:16px;background:#4338ca;touch-action:none;cursor:grab}</style></head>
<body><h1>Billing</h1><div role="tablist"><button role="tab">Invoices</button> <button role="tab">Cards</button></div>
<p><button id="more" type="button" onclick="document.getElementById('menu').classList.toggle('open')">More options</button></p>
<div id="menu"><p>Export all invoices</p><p>Change billing email</p><p>Close account</p></div>
<div class="track"><div id="knob" role="button" aria-label="Invoice card" tabindex="0"></div></div>
<p><button id="done" type="button">Download invoice</button></p>
<script>
  var knob = document.getElementById('knob'), dx = 0, on = false;
  knob.addEventListener('pointerdown', function (e) { on = true; dx = e.clientX - knob.offsetLeft; knob.setPointerCapture(e.pointerId); });
  knob.addEventListener('pointermove', function (e) { if (on) knob.style.left = Math.max(0, Math.min(680, e.clientX - dx)) + 'px'; });
  knob.addEventListener('pointerup', function () { on = false; });
</script></body></html>
